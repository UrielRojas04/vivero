server {
    listen 80;

    # Directorio donde Vite genera los archivos
    root /usr/share/nginx/html;
    index index.html;

    # Proxy de la API al backend (agregado 2026-09-05, demo con túnel único): la cuenta gratis de
    # ngrok sólo da UN dominio fijo, no uno por túnel -- así que frontend y backend no pueden
    # tunelearse por separado. Acá nginx sirve los estáticos Y reenvía /api al backend, todo bajo
    # el mismo puerto 80, para que un solo túnel alcance. El build de frontend-prod ya arma
    # VITE_API_URL=/api (ver docker-compose.yml), así que el frontend pega acá sin saber que hay
    # un proxy en el medio. proxy_buffering off para no romper el stream de SSE (/api/events/...).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        # Si no encuentra el archivo, sirve index.html (necesario para React Router SPA)
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Manejo de errores 404
    error_page 404 /index.html;
}
