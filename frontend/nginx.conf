server {
    listen 80;

    # Directorio donde Vite genera los archivos
    root /usr/share/nginx/html;
    index index.html;

    # Headers de seguridad (hallazgo de auditoría, 2026-09-09, antes de VPS): no había ninguno.
    # Strict-Transport-Security no hace nada servido por HTTP puro (este nginx no termina TLS,
    # eso lo hace lo que esté delante en el VPS -- Hostinger/Certbot/reverse proxy), pero es
    # inofensivo dejarlo: los navegadores sólo lo respetan si la respuesta llegó por HTTPS, así
    # que empieza a funcionar solo apenas haya TLS delante, sin tocar este archivo de nuevo.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 'unsafe-inline' en style-src: React aplica estilos inline vía el atributo style (ej.
    # FirmaCanvas.jsx), no sólo clases de Tailwind -- sin esto se rompen. img-src incluye data:
    # por las firmas digitales, que se muestran como <img src="data:image/png;base64,...">.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:" always;

    # Proxy de la API al backend (agregado 2026-09-05, demo con túnel único): la cuenta gratis de
    # ngrok sólo da UN dominio fijo, no uno por túnel -- así que frontend y backend no pueden
    # tunelearse por separado. Acá nginx sirve los estáticos Y reenvía /api al backend, todo bajo
    # el mismo puerto 80, para que un solo túnel alcance. El build de frontend-prod ya arma
    # VITE_API_URL=/api (ver docker-compose.yml), así que el frontend pega acá sin saber que hay
    # un proxy en el medio. proxy_buffering off para no romper el stream de SSE (/api/events/...).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        # Si no encuentra el archivo, sirve index.html (necesario para React Router SPA)
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Manejo de errores 404
    error_page 404 /index.html;
}
