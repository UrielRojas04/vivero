# Config de referencia del Nginx DEL SISTEMA OPERATIVO del VPS (fuera de Docker).
#
# Este archivo NO se aplica solo -- es la copia documentada de lo que vive en
# /etc/nginx/sites-available/<dominio> en el servidor real, para poder reconstruir el VPS desde
# cero sin tener que rearmar esto a mano de nuevo. Reemplazar "weblopez.online" por el dominio
# real si cambia.
#
# Por qué existe este nginx ADEMÁS del de frontend-prod (frontend/nginx.conf, el que corre
# adentro de Docker): éste es el único que escucha en el puerto 80/443 público del VPS y termina
# TLS (HTTPS real, certificado de Let's Encrypt). Le hace proxy_pass a frontend-prod, que corre
# atado a 127.0.0.1:8081 (ver docker-compose.prod.yml) -- nunca expuesto directo a internet.
# frontend-prod adentro sigue haciendo lo suyo (servir los estáticos de React + proxy /api al
# backend por la red interna de Docker), este nginx del sistema no sabe nada de esa parte.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# PASOS PARA RECREAR ESTO EN UN VPS NUEVO (una sola vez, después de `docker compose -f
# docker-compose.prod.yml up -d --build` con el .env de producción ya cargado):
#
#   apt-get install -y nginx certbot python3-certbot-nginx
#
#   # Pegar este archivo (con el dominio real) en:
#   #   /etc/nginx/sites-available/<dominio>
#   ln -s /etc/nginx/sites-available/<dominio> /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
#   # Certbot reescribe este mismo archivo agregando los bloques SSL/redirect --
#   # correrlo DESPUÉS de tener el bloque HTTP básico arriba:
#   certbot --nginx -d <dominio> -d www.<dominio>
#
#   # Hallazgo real de esta sesión: Certbot por defecto arma UN bloque 443 que atiende el
#   # dominio Y el www juntos -- eso hace que ambos "carguen" la app, pero el backend rechaza
#   # los pedidos desde www.<dominio> por CORS (app.cors.allowed-origins/FRONTEND_URL sólo
#   # tiene el dominio sin www). La solución no es agregar el www a CORS, es partir el bloque
#   # 443 en dos como abajo: uno que redirige www -> dominio sin www, y el otro que sirve de
#   # verdad. Así queda una sola URL canónica, sin mantener dos orígenes CORS sincronizados.
# ─────────────────────────────────────────────────────────────────────────────────────────────

server {
    listen 443 ssl;
    server_name www.weblopez.online;

    ssl_certificate /etc/letsencrypt/live/weblopez.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weblopez.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://weblopez.online$request_uri;
}

server {
    listen 443 ssl;
    server_name weblopez.online;

    ssl_certificate /etc/letsencrypt/live/weblopez.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weblopez.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    server_name weblopez.online www.weblopez.online;
    return 301 https://weblopez.online$request_uri;
}
