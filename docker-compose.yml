services:
  vivero-db:
    image: postgres:15
    container_name: vivero-postgres
    env_file:
      - .env
    ports:
      # Atado a 127.0.0.1 (hallazgo de auditoría de seguridad, 2026-09-09, antes de VPS): sin esto,
      # el puerto queda bindeado a 0.0.0.0 -- inofensivo en una PC de desarrollo detrás de un
      # router, pero en un VPS con IP pública expone Postgres directo a internet. Sigue accesible
      # desde el host (pgAdmin, DBeaver, etc. en localhost:5433) y desde los demás contenedores de
      # este compose (se resuelven por nombre de servicio en la red interna, no por este binding).
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vivero-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vivero_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: vivero-backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      vivero-db:
        condition: service_healthy
    networks:
      - vivero-net

  # Frontend en modo DESARROLLO (default): corre Vite con HMR.
  # El código del host se monta en vivo → los cambios se reflejan al instante.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: vivero-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - vivero-net

  # Frontend en modo PRODUCCIÓN (opt-in): build de Vite servida por nginx.
  # Levantar con: docker compose --profile prod up frontend-prod
  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    container_name: vivero-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - vivero-net


volumes:
  postgres_data:

networks:
  vivero-net:
    driver: bridge