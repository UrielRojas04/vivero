spring.application.name=gestion-vivero
spring.datasource.url=jdbc:postgresql://localhost:5432/vivero_db?serverTimezone=UTC
spring.datasource.username=admin
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.cors.allowed-origins=http://localhost:5173,http://192.168.1.10:5173,${FRONTEND_URL:http://localhost:5173}