spring.application.name=gestion-vivero
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/vivero_db?serverTimezone=UTC}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Lista fija de orígenes (SecurityConfig ya no usa "*", hallazgo de auditoría de seguridad
# 2026-09-09): localhost para desarrollo en la PC, la IP LAN actual para probar desde el celular
# en la misma red, y FRONTEND_URL para el dominio real una vez en el VPS (setear en .env ahí).
app.cors.allowed-origins=http://localhost:5173,http://192.168.1.150:5173,${FRONTEND_URL:http://localhost:5173}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}