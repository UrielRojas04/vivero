# Perfil de producción (hallazgo de auditoría de seguridad, 2026-09-09, antes de VPS). Activar
# con SPRING_PROFILES_ACTIVE=prod en el .env del VPS -- sin esa variable, application.properties
# sigue solo, sin cambios (desarrollo local no se ve afectado).
#
# spring.jpa.ddl-auto=update queda IGUAL que en desarrollo a propósito: este proyecto no tiene
# Flyway/Liquibase, así que es el único mecanismo que crea/actualiza el schema en una base nueva
# (el primer deploy al VPS). Pasarlo a "validate"/"none" acá rompería ese primer deploy sin un
# reemplazo -- queda como una migración futura, no parte de este fix.
spring.jpa.show-sql=false
